<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="/styles.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="px-3">
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">generic</a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" id="nav-login" href="/login.html">Login</a>
              <button type="button" class="nav-link d-none" id="nav-logout">
                Log out
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div>
              <h1 class="h3 mb-4">Log in</h1>
              <form method="post" id="login-form">
                <div class="mb-3">
                  <label for="login-email" class="form-label">Email</label>
                  <input
                    id="login-email"
                    name="email"
                    type="email"
                    required
                    autocomplete="email"
                    class="form-control"
                  />
                </div>
                <div class="mb-3">
                  <label for="login-password" class="form-label"
                    >Password</label
                  >
                  <input
                    id="login-password"
                    name="password"
                    required
                    type="password"
                    autocomplete="current-password"
                    class="form-control"
                  />
                </div>
                <div
                  id="login-error"
                  class="alert alert-danger d-none"
                  role="alert"
                ></div>
                <button type="submit" class="btn btn-primary w-100">
                  Log in
                </button>
              </form>
            </div>

            <div class="mt-5">
              <h2 class="h3 mb-4">Register</h2>
              <form method="post" id="register-form">
                <div class="mb-3">
                  <label for="register-first-name" class="form-label"
                    >First name</label
                  >
                  <input
                    id="register-first-name"
                    name="first-name"
                    minlength="1"
                    maxlength="100"
                    required
                    type="text"
                    class="form-control"
                  />
                </div>
                <div class="mb-3">
                  <label for="register-last-name" class="form-label"
                    >Last name</label
                  >
                  <input
                    id="register-last-name"
                    name="last-name"
                    minlength="1"
                    maxlength="100"
                    required
                    type="text"
                    class="form-control"
                  />
                </div>
                <div class="mb-3">
                  <label for="register-email" class="form-label">Email</label>
                  <input
                    id="register-email"
                    name="email"
                    type="email"
                    required
                    autocomplete="email"
                    class="form-control"
                  />
                </div>
                <div class="mb-3">
                  <label for="register-password" class="form-label"
                    >Password</label
                  >
                  <input
                    id="register-password"
                    name="password"
                    required
                    minlength="12"
                    maxlength="128"
                    type="password"
                    autocomplete="new-password"
                    class="form-control"
                    aria-describedby="register-password-help"
                  />
                  <div id="register-password-help" class="form-text">
                    At least 12 characters.
                  </div>
                </div>
                <div
                  id="register-error"
                  class="alert alert-danger d-none"
                  role="alert"
                ></div>
                <button type="submit" class="btn btn-primary w-100">
                  Register
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/api.js"></script>
    <script src="/auth.js"></script>
  </body>
</html>
