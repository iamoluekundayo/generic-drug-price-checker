<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my quotes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="/styles.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="px-3">
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">generic</a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" id="nav-login" href="/login.html">Login</a>
              <button type="button" class="nav-link d-none" id="nav-logout">
                Log out
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <div class="container">
        <h1 class="h3 my-5">My quotes</h1>
        <p class="d-none text-muted" id="quotes-empty">
          No quotes yet. <a href="/">Search for a drug</a> to compare a price
          and save it.
        </p>
        <div
          id="quotes-container"
          class="row row-cols-1 row-cols-md-2 g-3"
        ></div>
        <div
          id="quotes-pagination"
          class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-4"
        >
          <p id="quotes-range-text" class="mb-0"></p>
          <div class="d-flex align-items-center gap-3">
            <button
              id="quotes-previous-button"
              type="button"
              class="btn btn-outline-secondary"
            >
              Previous
            </button>
            <p id="quotes-page-text" class="mb-0"></p>
            <button
              id="quotes-next-button"
              type="button"
              class="btn btn-outline-secondary"
            >
              Next
            </button>
          </div>
        </div>
        <div
          id="quotes-error"
          class="alert alert-danger d-none"
          role="alert"
        ></div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/api.js"></script>
    <script src="/quotes.js"></script>
  </body>
</html>
