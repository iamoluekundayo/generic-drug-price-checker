<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>generic</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="/styles.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="px-3">
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">generic</a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" id="nav-login" href="/login.html">Login</a>
              <button type="button" class="nav-link d-none" id="nav-logout">
                Log out
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="d-flex align-items-center search-hero">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-10 col-lg-9">
            <h1 id="greeting" class="fs-2 mb-4 text-center">Hi, there</h1>
            <form id="search-form">
              <label for="search-input" class="visually-hidden"
                >Search for a drug</label
              >
              <input
                id="search-input"
                name="q"
                class="form-control form-control-lg rounded-pill"
                placeholder="Search for a generic drug"
              />
              <div class="d-flex">
                <div class="form-text ms-3">
                  Prices are NADAC: what pharmacies pay for a drug, not what you
                  pay at the counter
                </div>
                <a
                  id="search-quotes"
                  href="/quotes.html"
                  class="form-text d-none"
                  >my quotes</a
                >
              </div>
            </form>
          </div>
        </div>
        <section id="search-result" class="d-none row justify-content-center">
          <ul id="search-result-list" class="col-md-10 col-lg-9"></ul>
          <div id="search-result-button">
            <button id="search-previous" class="btn btn-primary">
              Previous
            </button>
            <button id="search-next" class="btn btn-primary">Next</button>
          </div>
          <div id="search-message" class="d-none"></div>
        </section>
        <section id="history-section" class="d-none">
          <h1 id="history-drug-name" class="h3"></h1>
          <div id="history-message"></div>
          <canvas id="history-canvas"></canvas>
        </section>
        <section id="compare-section" class="d-none">
          <h1 id="compare-drug-name" class="h3"></h1>
          <form action="compare-form">
            <label for="compare-form-quantity"
              >quantity(<span id="compare-form-unit"></span>):
            </label>
            <input
              id="compare-form-quantity"
              type="number"
              min="0.001"
              step="0.001"
              inputmode="decimal"
            />
            <label for="compare-form-quoted-price">Quote Price: </label>
            <input
              id="compare-form-quoted-price"
              type="number"
              min="0"
              step="0.01"
              inputmode="decimal"
            />
            <button
              id="compare-form-submit"
              type="submit"
              class="btn btn-primary"
            >
              Compare
            </button>
          </form>
          <div id="compare-result"></div>
        </section>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/api.js"></script>
    <script src="/search.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"
      integrity="sha384-Emf5ZVIUiarAdhkgtqK+5/Z5qIvM6QoVrS+qAVtfyZVuD5lIHrac0me485+Antp0"
      crossorigin="anonymous"
    ></script>
    <script src="history.js"></script>
  </body>
</html>
